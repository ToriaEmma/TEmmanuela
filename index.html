<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emmanuela — Portfolio</title>
    <!-- Police du loader : la regle `body * { font-family: "circular-web"
         !important }` s'applique aussi au compteur et au titre du loader,
         c'est donc circular-web qui s'affiche en premier (et non Anton).
         Prechargee ici, elle part avec le HTML au lieu d'attendre le CSS.
         Anton (titre du hero) n'est demande qu'apres la premiere image du
         loader, par src/utils/warmUpSite.ts : il est en cache bien avant la
         fin du loader, sans concurrencer son demarrage. -->
    <link rel="preload" href="/fonts/circularweb-book.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Premier visuel du loader : il apparait dans les toutes premieres
         frames de l'animation, donc on ne veut pas l'attendre. -->
    <link rel="preload" href="/loader/1.webp" as="image" fetchpriority="high"
      imagesrcset="/loader/1-540.webp 540w, /loader/1.webp 720w"
      imagesizes="(min-width: 768px) 25vw, 50vw" />
    <!-- Visuels du hero : ils doivent etre en cache avant la fin du loader,
         sinon leur arrivee change la hauteur de la page en plein geste. Ils
         ne sont plus precharges ici mais par src/utils/warmUpSite.ts, une fois
         la premiere image du loader affichee : demandes des le HTML, ils
         concurrencaient le script et la police du loader sur le reseau. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
